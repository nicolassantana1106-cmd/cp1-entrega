<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogar — Handshake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="container topo">
    <a class="marca" href="index.html">hand<span>shake</span></a>
  </header>
  <main class="container">
  <div class="jogo" id="quiz">
    <!-- Bloco 1: progresso -->
    <div class="progresso" id="progresso">
      <span id="progresso-texto">Pergunta 1 de 4</span>
      <div class="progresso-barra" aria-hidden="true"><i></i></div>
    </div>

    <!-- Bloco 2: pergunta (o CP2 preenche com perguntas.json) -->
    <h1 class="pergunta" id="pergunta">O que o HTTPS adiciona ao HTTP?</h1>

    <!-- Bloco 3: alternativas -->
    <ul class="alternativas" id="alternativas">
      <li><button class="alternativa" type="button" data-indice="0"><span class="letra">A</span>Criptografia da comunicação com TLS</button></li>
      <li><button class="alternativa" type="button" data-indice="1"><span class="letra">B</span>Compressão automática de imagens</button></li>
      <li><button class="alternativa" type="button" data-indice="2"><span class="letra">C</span>Cache permanente no navegador</button></li>
      <li><button class="alternativa" type="button" data-indice="3"><span class="letra">D</span>Velocidade de download ilimitada</button></li>
    </ul>

    <!-- Bloco 4: feedback (anunciado por leitores de tela) -->
    <div class="feedback" id="feedback" role="status" aria-live="polite">
      <p>Escolha uma alternativa. O feedback e a explicação aparecem aqui.</p>
    </div>

    <!-- Bloco 5: avançar -->
    <div class="acoes">
      <button class="botao" id="proxima" type="button" disabled>Próxima</button>
    </div>
  </div>

  <!-- Resultado final -->
  <section class="jogo resultado" id="resultado" hidden>
    <h1 class="pergunta">Fim de jogo</h1>
    <div class="feedback"><strong id="placar"></strong></div>
    <div class="acoes">
      <button class="botao" id="reiniciar" type="button">Jogar de novo</button>
    </div>
  </section>
  </main>
  <script src="js/perguntas-embutidas.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
